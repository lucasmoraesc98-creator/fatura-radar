    :root {
      --bg: #09090b;
      --surface: #121216;
      --surface-2: #18181f;
      --surface-3: #20202a;
      --border: rgba(255, 255, 255, 0.08);
      --border-strong: rgba(255, 255, 255, 0.22);
      --text: #f4f4f6;
      --muted: #9a9aa6;
      --muted-2: #71717a;
      --accent: #10b981;
      --accent-light: #6ee7b7;
      --sky: #38bdf8;
      --rose: #f43f5e;
      --amber: #fbbf24;
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

    html, body {
      margin: 0;
      padding: 0;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, sans-serif;
      min-height: 100dvh;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
    }

    .tabular { font-variant-numeric: tabular-nums; }

    .app-shell {
      width: 100%;
      max-width: 460px;
      margin: 0 auto;
      padding: calc(14px + var(--safe-top)) 14px calc(36px + var(--safe-bottom));
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 22px;
      padding: 15px;
    }

    .surface {
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: 16px;
    }

    .row-between {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--border);
      padding: 4px 10px;
      font-size: 11px;
      font-weight: 600;
      color: #d4d4d8;
    }

    .dot {
      width: 6px;
      height: 6px;
      border-radius: 999px;
      flex-shrink: 0;
    }

    .btn-ghost {
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--border);
      padding: 4px 10px;
      font-size: 11px;
      font-weight: 600;
      color: #d4d4d8;
      cursor: pointer;
    }

    .grid-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .badge-work, .badge-leisure, .badge-refund {
      display: inline-block;
      margin-left: 5px;
      padding: 1px 6px;
      border-radius: 999px;
      font-size: 10px;
      font-weight: 700;
    }

    .badge-work { background: rgba(56, 189, 248, 0.18); color: #7dd3fc; }
    .badge-leisure { background: rgba(244, 63, 94, 0.18); color: #fda4af; }
    .badge-refund { background: rgba(16, 185, 129, 0.18); color: #6ee7b7; }

    .cat-card {
      padding: 12px;
      cursor: pointer;
      transition: background 0.15s ease, border-color 0.15s ease;
    }

    .cat-card.expanded {
      background: var(--surface-3);
      border-color: var(--border-strong);
    }

    .bar-track {
      margin-top: 8px;
      height: 6px;
      width: 100%;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.08);
      overflow: hidden;
    }

    .bar-fill {
      height: 100%;
      border-radius: 999px;
    }

    .donut-wrap {
      position: relative;
      width: 210px;
      height: 210px;
      margin: 14px auto;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .donut-center {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 0 14px;
      pointer-events: none;
    }

    .truncate {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
  </style>

      function parseMoney(v) {
        if (typeof v === "number") return Math.round(v * 100) / 100;
        if (!v) return 0;
        let s = String(v).replace(/R\$|\s+/g, "").trim();
        if (s.includes(",") && s.includes(".")) {
          s = s.replace(/\./g, "").replace(",", ".");
        } else if (s.includes(",")) {
          s = s.replace(",", ".");
        }
        const n = parseFloat(s);
        return isNaN(n) ? 0 : Math.round(n * 100) / 100;
      }

      const roundCents = n => Math.round((Number(n) || 0) * 100) / 100;
      const toCents = n => Math.round(roundCents(n) * 100);
      const pad2 = n => String(n).padStart(2, "0");

      function formatBRL(v) {
        return (Number(v) || 0).toLocaleString("pt-BR", { style: "currency", currency: "BRL" });
      }

      function todayBR() {
        const d = new Date();
        return pad2(d.getDate()) + "/" + pad2(d.getMonth() + 1) + "/" + d.getFullYear();
      }

      function nowTimeBR() {
        const d = new Date();
        return pad2(d.getHours()) + ":" + pad2(d.getMinutes());
      }

      function formatDateBR(raw) {
        if (!raw) return todayBR();
        const s = String(raw).trim();
        const dmy = s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);
        if (dmy) return pad2(dmy[1]) + "/" + pad2(dmy[2]) + "/" + dmy[3];
        const iso = s.match(/^(\d{4})-(\d{2})-(\d{2})/);
        if (iso) return iso[3] + "/" + iso[2] + "/" + iso[1];
        const p = new Date(s);
        return isNaN(p.getTime()) ? s : pad2(p.getDate()) + "/" + pad2(p.getMonth() + 1) + "/" + p.getFullYear();
      }

      function sortDateDesc(a, b) {
        const pa = String(a.data || "").split("/");
        const pb = String(b.data || "").split("/");
        const da = pa.length === 3 ? Number(pa[2] + pa[1] + pa[0]) : 0;
        const db = pb.length === 3 ? Number(pb[2] + pb[1] + pb[0]) : 0;
        if (db !== da) return db - da;
        return (Number(b.id) || 0) - (Number(a.id) || 0);
      }

      function readCache() {
        try {

          const parsed = raw ? JSON.parse(raw) : null;
          return Array.isArray(parsed) && parsed.length > 0 ? parsed : null;
        } catch (_) {
          return null;
        }
      }

      function saveCache(list) {
        try { localStorage.setItem(STORAGE_KEY, JSON.stringify(list)); } catch (_) {}

      let remoteEntries = readCache();

      let syncState = "syncing";
      let isPulling = false;

      // Usa exclusivamente a planilha quando disponível (sem misturar dados antigos fixos)
      function getAllEntries() {
        const source = Array.isArray(remoteEntries) && remoteEntries.length > 0
          ? remoteEntries
          : FALLBACK_RECORDS;

        return source
          .filter(it => {
            if (!it) return false;
            const desc = String(it.estabelecimento || "").trim().toLowerCase();
            if (!desc || desc === "total geral" || desc === "estabelecimento") return false;
            return toCents(it.valor) !== 0;
          })
          .map(it => Object.assign({}, it, {
            data: formatDateBR(it.data),
            valor: roundCents(it.valor)
          }))
          .sort(sortDateDesc);
      }

      function groupCategories(entries) {
        const map = {};
        for (let i = 0; i < entries.length; i++) {
          const it = entries[i];
          const cat = it.categoria || "Compras / Presentes";
          if (!map[cat]) {
            map[cat] = {
              name: cat,
              total: 0,
              count: 0,
              items: [],
              color: CATEGORY_COLORS[cat] || "#10b981",
              cap: CATEGORY_CAPS[cat] || 300
            };
          }
          map[cat].total = roundCents(map[cat].total + it.valor);
          map[cat].count += 1;
          map[cat].items.push(it);
        }
        return Object.values(map).sort((a, b) => b.total - a.total);
      }

      async function fetchTimeout(url, opts) {
        const ctrl = typeof AbortController !== "undefined" ? new AbortController() : null;
        const timer = ctrl ? setTimeout(() => ctrl.abort(), SYNC_TIMEOUT_MS) : null;
        try {
          return await fetch(url, Object.assign({}, opts || {}, ctrl ? { signal: ctrl.signal } : {}));
        } finally {
          if (timer) clearTimeout(timer);
        }
      }

      async function syncPull(silent) {
        if (!APPS_SCRIPT_URL || isPulling) return;
        isPulling = true;
        if (!silent) {
          syncState = "syncing";
          renderApp();
        }

        try {
          const sep = APPS_SCRIPT_URL.includes("?") ? "&" : "?";
          const res = await fetchTimeout(APPS_SCRIPT_URL + sep + "t=" + Date.now(), {
            method: "GET",
            redirect: "follow"
          });
          if (!res || !res.ok) throw new Error("HTTP");
          const data = await res.json();
          const rawList = Array.isArray(data) ? data : (data && Array.isArray(data.items) ? data.items : null);

          if (rawList && rawList.length > 0) {
            const parsed = rawList.map((r, idx) => {
              const desc = String(r.desc || r.estabelecimento || r.Estabelecimento || "").trim();
              const sub = String(r.subtipo || r["Subtipo / Tag"] || r.tag || "").trim();
              const rawVal = r.val !== undefined ? r.val : (r.valor !== undefined ? r.valor : r["Valor (R$)"]);
              const rawPay = String(r.meioPagamento || r.pagamento || "").trim();
              const isDebit = rawPay.toLowerCase() === "débito"
                || desc.toLowerCase().includes("débito")
                || sub.toLowerCase().includes("débito");

              return {
                id: String(r.id || r.ID || (idx + 1)),
                data: formatDateBR(r.date || r.data || r.Data || todayBR()),
                estabelecimento: desc,
                valor: parseMoney(rawVal),
                categoria: String(r.cat || r.categoria || r.Categoria || "Compras / Presentes").trim(),
                subtipo: sub,
                meioPagamento: isDebit ? "Débito" : "Crédito",
                origem: String(r.origem || r.Origem || "Planilha").trim()
              };
            }).filter(it => it.estabelecimento && it.estabelecimento.toLowerCase() !== "total geral" && toCents(it.valor) !== 0);

            if (parsed.length > 0) {
              remoteEntries = parsed;
              saveCache(remoteEntries);
              syncState = "synced";
              lastSyncTime = nowTimeBR();
            } else {
              syncState = "fallback";
            }
          } else {
            syncState = "fallback";
          }
        } catch (_) {
          syncState = "fallback";
        } finally {
          isPulling = false;
          renderApp();
        }
      }

      function buildDonutSVG(categories, total) {
        const r = 74, cx = 105, cy = 105, circ = 2 * Math.PI * r;
        let offset = 0;
        const segs = categories.map(cat => {
          const val = Math.max(0, cat.total);
          const frac = total > 0 ? val / total : 0;
          const dash = frac * circ;
          const gap = Math.max(0, circ - dash);
          const active = selectedCategory === cat.name;
          const opacity = selectedCategory && !active ? 0.35 : 1;
          const circle = `<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${cat.color}" stroke-width="${active ? 24 : 20}" stroke-dasharray="${dash.toFixed(2)} ${gap.toFixed(2)}" stroke-dashoffset="${(-offset).toFixed(2)}" transform="rotate(-90 ${cx} ${cy})" opacity="${opacity}" style="cursor:pointer" data-cat="${encodeURIComponent(cat.name)}" />`;
          offset += dash;
          return circle;
        }).join("");
        return `<svg width="210" height="210" viewBox="0 0 210 210">${segs}</svg>`;
      }

      function esc(s) {
        return String(s || "")
          .replace(/&/g, "&")
          .replace(/</g, "<")
          .replace(/>/g, ">")
          .replace(/"/g, """);
      }

      function renderApp() {
        const root = document.getElementById("app");
        if (!root) return;

        const entries = getAllEntries();
        const grandTotal = roundCents(entries.reduce((s, x) => s + x.valor, 0));
        const debitTotal = roundCents(entries.filter(x => String(x.meioPagamento).toLowerCase() === "débito").reduce((s, x) => s + x.valor, 0));
        const creditTotal = roundCents(grandTotal - debitTotal);

        const cats = groupCategories(entries);
        const activeCat = cats.find(c => c.name === selectedCategory);
        const workTotal = roundCents(entries.filter(x => x.categoria === "Transporte" && x.subtipo === "Trabalho").reduce((s, x) => s + x.valor, 0));
        const leisureTotal = roundCents(entries.filter(x => x.categoria === "Transporte" && x.subtipo === "Lazer").reduce((s, x) => s + x.valor, 0));

        const recent = entries.slice(0, 5);
        const syncColor = syncState === "synced" ? "#34d399" : syncState === "syncing" ? "#38bdf8" : "#fbbf24";
        const syncText = syncState === "synced" ? "Planilha OK" + (lastSyncTime ? " · " + lastSyncTime : "") : syncState === "syncing" ? "Sincronizando..." : "Cache Local";

        const recentHtml = recent.map(it => {
          const badge = it.subtipo === "Trabalho" ? '<span class="badge-work">Trabalho</span>'
            : it.subtipo === "Lazer" ? '<span class="badge-leisure">Lazer</span>'
            : it.valor < 0 ? '<span class="badge-refund">Estorno</span>' : "";
          return `
            <div class="row-between tabular" style="padding:7px 0;border-bottom:1px solid rgba(255,255,255,0.06);font-size:12px;">
              <div style="min-width:0;display:flex;align-items:center;gap:8px;">
                <span class="dot" style="background:#34d399;"></span>
                <div class="truncate">
                  <span style="font-weight:600;">${esc(it.estabelecimento)}</span>${badge}
                  <div style="font-size:10px;color:#71717a;">${esc(it.data)} · ${esc(it.categoria)} · ${esc(it.meioPagamento || "Crédito")}</div>
                </div>
              </div>
              <span style="font-weight:700;color:${it.valor < 0 ? "#6ee7b7" : "#f4f4f6"};flex-shrink:0;">${formatBRL(it.valor)}</span>
            </div>`;
        }).join("");

        const catsHtml = cats.map(c => {
          const share = grandTotal > 0 ? ((c.total / grandTotal) * 100).toFixed(1) : "0.0";
          const ratio = c.cap > 0 ? Math.min(100, Math.max(0, (c.total / c.cap) * 100)).toFixed(1) : "100.0";
          const bal = roundCents(c.cap - c.total);
          const balTxt = bal >= 0 ? "Saldo: " + formatBRL(bal) : "Acima: " + formatBRL(Math.abs(bal));
          const exp = selectedCategory === c.name;
          const itemsHtml = exp ? `<div style="margin-top:10px;padding-top:10px;border-top:1px solid rgba(255,255,255,0.08);display:flex;flex-direction:column;gap:6px;">
            ${c.items.map(e => {
              const b = e.subtipo === "Trabalho" ? '<span class="badge-work">Trabalho</span>' : e.subtipo === "Lazer" ? '<span class="badge-leisure">Lazer</span>' : "";
              return `<div class="row-between tabular" style="font-size:12px;color:#9a9aa6;">
                <span class="truncate">${esc(e.data)} · <strong style="color:#f4f4f6;">${esc(e.estabelecimento)}</strong>${b}</span>
                <span style="font-weight:600;color:${e.valor < 0 ? "#6ee7b7" : "#e4e4e7"};flex-shrink:0;">${formatBRL(e.valor)}</span>
              </div>`;
            }).join("")}
          </div>` : "";

          return `
            <div class="surface cat-card ${exp ? "expanded" : ""}" data-cat="${encodeURIComponent(c.name)}">
              <div class="row-between tabular" style="font-size:13px;font-weight:600;">
                <span style="display:flex;align-items:center;gap:8px;min-width:0;">
                  <span class="dot" style="width:10px;height:10px;background:${c.color};"></span>
                  <span class="truncate">${esc(c.name)}</span>
                </span>
                <span style="flex-shrink:0;">${formatBRL(c.total)} (${share}%)</span>
              </div>
              <div class="bar-track"><div class="bar-fill" style="width:${ratio}%;background:${c.color};"></div></div>
              <div class="row-between tabular" style="margin-top:6px;font-size:11px;color:#9a9aa6;">
                <span class="truncate">${c.count} itens · Teto ${formatBRL(c.cap)} (${balTxt})</span>
                <span style="flex-shrink:0;">${exp ? "Ocultar ▲" : "Itens ▼"}</span>
              </div>
              ${itemsHtml}
            </div>`;
        }).join("");

        root.innerHTML = `
          <div class="card">
            <div class="row-between">
              <span style="font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:#34d399;">Fatura Radar — Nov 2026</span>
              <div style="display:flex;align-items:center;gap:6px;">
                <span class="pill"><span class="dot" style="background:${syncColor};"></span><span>${syncText}</span></span>
                <button type="button" class="btn-ghost" data-action="refresh">${isPulling ? "..." : "Atualizar ↻"}</button>
              </div>
            </div>
            <div style="margin-top:10px;font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:#9a9aa6;">Últimos Lançamentos</div>
            ${recentHtml}
          </div>

          <div class="card">
            <div style="font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:#34d399;">Total Consolidado</div>
            <div class="tabular" style="margin-top:2px;font-size:28px;font-weight:800;letter-spacing:-0.02em;">${formatBRL(grandTotal)}</div>
            <div class="tabular" style="font-size:12px;color:#9a9aa6;">${entries.length} lançamentos · Crédito: ${formatBRL(creditTotal)} · Débito: ${formatBRL(debitTotal)}</div>

            <div class="grid-2" style="margin-top:12px;">
              <div class="surface tabular" style="padding:11px;">
                <div style="font-size:11px;color:#9a9aa6;">Transporte — Trabalho</div>
                <div style="margin-top:2px;font-size:16px;font-weight:700;color:#38bdf8;">${formatBRL(workTotal)}</div>
              </div>
              <div class="surface tabular" style="padding:11px;">
                <div style="font-size:11px;color:#9a9aa6;">Transporte — Lazer</div>
                <div style="margin-top:2px;font-size:16px;font-weight:700;color:#f43f5e;">${formatBRL(leisureTotal)}</div>
              </div>
            </div>

            <div class="donut-wrap">
              ${buildDonutSVG(cats, grandTotal)}
              <div class="donut-center tabular">
                <div style="font-size:11px;text-transform:uppercase;color:#9a9aa6;">${esc(activeCat ? activeCat.name.split(" / ")[0] : "Fatura Líquida")}</div>
                <div style="margin-top:2px;font-size:17px;font-weight:800;">${formatBRL(activeCat ? activeCat.total : grandTotal)}</div>
                <div style="margin-top:2px;font-size:11px;font-weight:600;color:#34d399;">${activeCat ? ((activeCat.total / (grandTotal || 1)) * 100).toFixed(1) + "% · " + activeCat.count + " itens" : entries.length + " itens"}</div>
              </div>
            </div>

            <div style="display:flex;flex-direction:column;gap:9px;">${catsHtml}</div>
          </div>
        `;
      }

      document.getElementById("app").addEventListener("click", e => {
        const actionEl = e.target.closest("[data-action]");
        if (actionEl && actionEl.getAttribute("data-action") === "refresh") {
          syncPull(false);
          return;
        }
        const catEl = e.target.closest("[data-cat]");
        if (catEl) {
          const name = decodeURIComponent(catEl.getAttribute("data-cat"));
          selectedCategory = selectedCategory === name ? null : name;
          renderApp();
        }
      });

      renderApp();
      syncPull(false);
      setInterval(() => {
        if (!document.hidden) syncPull(true);
      }, AUTO_SYNC_INTERVAL_MS);
      document.addEventListener("visibilitychange", () => {
        if (!document.hidden) syncPull(true);
      });
      window.addEventListener("focus", () => syncPull(true));
    })();
  </script>
</body>
</html>
