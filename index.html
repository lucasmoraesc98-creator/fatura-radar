<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Fatura Radar — Lançamento por Voz / Texto</title>
  <style>
    * { box-sizing: border-box; font-family: system-ui, -apple-system, sans-serif; }
    body {
      margin: 0;
      background: #0f1115;
      color: #f3f4f6;
      display: flex;
      justify-content: center;
      padding: 24px 16px;
    }
    .app {
      width: 100%;
      max-width: 520px;
      background: #181b22;
      border: 1px solid #2a2f3a;
      border-radius: 16px;
      padding: 20px;
    }
    h1 { margin: 0 0 4px; font-size: 20px; }
    p.sub { margin: 0 0 18px; color: #9ca3af; font-size: 13px; }
    .row { display: flex; gap: 8px; }
    input {
      flex: 1;
      padding: 12px 14px;
      border-radius: 10px;
      border: 1px solid #323846;
      background: #101318;
      color: #fff;
      font-size: 15px;
      outline: none;
    }
    input:focus { border-color: #7c3aed; }
    button {
      border: none;
      border-radius: 10px;
      padding: 12px 14px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      color: #fff;
      background: #7c3aed;
      transition: opacity 0.15s, transform 0.1s;
    }
    button:active { transform: scale(0.98); }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    #btnMic {
      background: #252b38;
      border: 1px solid #384152;
      min-width: 48px;
    }
    #btnMic.listening {
      background: #dc2626;
      border-color: #ef4444;
      animation: pulse 1s infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.65; }
    }
    .status {
      margin-top: 12px;
      padding: 10px 12px;
      border-radius: 10px;
      background: #12151c;
      border: 1px solid #252a34;
      font-size: 13px;
      color: #d1d5db;
      min-height: 40px;
      white-space: pre-line;
    }
    .feed { margin-top: 18px; display: flex; flex-direction: column; gap: 8px; }
    .item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #12151c;
      border: 1px solid #232832;
      border-radius: 10px;
      padding: 10px 12px;
      font-size: 13px;
    }
    .item small { color: #9ca3af; display: block; margin-top: 2px; }
    .val { font-weight: 700; color: #34d399; white-space: nowrap; margin-left: 12px; }
  </style>
</head>
<body>
  <div class="app">
    <h1>Fatura Radar</h1>
    <p class="sub">Fale ou digite o gasto — classificação automática via Gemini + planilha</p>

    <div class="row">
      <button id="btnMic" type="button" title="Falar gasto">🎤</button>
      <input id="txtGasto" type="text" placeholder="Ex: 18 reais de uber agora ou pão no oxxo 12,40" autocomplete="off" />
      <button id="btnEnviar" type="button">Lançar</button>
    </div>

    <div id="status" class="status">Pronto. Fale no microfone ou digite um gasto.</div>
    <div id="feed" class="feed"></div>
  </div>

  <script>
    const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwiVxSFII6alKbvmr2v8gnFr7aO8I3aRXhwB6sfhS4_vTW3MAZQKGjnBgWOtqpFoeU4/exec";

    const btnMic = document.getElementById("btnMic");
    const btnEnviar = document.getElementById("btnEnviar");
    const txtGasto = document.getElementById("txtGasto");
    const statusEl = document.getElementById("status");
    const feedEl = document.getElementById("feed");

    // Reconhecimento de voz (Chrome / Edge / Android / Safari compatíveis)
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    let recognition = null;
    let ouvindo = false;

    if (SpeechRecognition) {
      recognition = new SpeechRecognition();
      recognition.lang = "pt-BR";
      recognition.interimResults = false;
      recognition.maxAlternatives = 1;

      recognition.onstart = () => {
        ouvindo = true;
        btnMic.classList.add("listening");
        statusEl.textContent = "Ouvindo... fale o gasto e a categoria/local.";
      };

      recognition.onresult = (event) => {
        const transcricao = event.results[0][0].transcript;
        txtGasto.value = transcricao;
        statusEl.textContent = `Você falou: "${transcricao}" — enviando...`;
        enviarGasto(transcricao);
      };

      recognition.onerror = (event) => {
        statusEl.textContent = `Erro no microfone: ${event.error}`;
      };

      recognition.onend = () => {
        ouvindo = false;
        btnMic.classList.remove("listening");
      };

      btnMic.addEventListener("click", () => {
        if (!ouvindo) recognition.start();
        else recognition.stop();
      });
    } else {
      btnMic.disabled = true;
      btnMic.title = "Microfone não suportado neste navegador";
    }

    async function enviarGasto(texto) {
      const msg = (texto || txtGasto.value).trim();
      if (!msg) return;

      btnEnviar.disabled = true;
      statusEl.textContent = "Classificando e salvando na planilha...";

      try {
        const res = await fetch(APPS_SCRIPT_URL, {
          method: "POST",
          headers: { "Content-Type": "text/plain;charset=utf-8" },
          body: JSON.stringify({ texto: msg })
        });
        const data = await res.json();

        if (!data.ok) {
          statusEl.textContent = `Erro: ${data.erro || "Falha ao salvar"}`;
          return;
        }

        if (data.acao === "excluido") {
          statusEl.textContent = `Removido: ${data.removido.estabelecimento} — R$ ${Number(data.removido.valor).toFixed(2)}`;
        } else {
          const item = data.item;
          const valorFmt = Number(item.valor).toLocaleString("pt-BR", { style: "currency", currency: "BRL" });
          statusEl.textContent = `Salvo (#${data.id}): ${item.estabelecimento} • ${item.categoria} (${item.subtipo})`;

          const card = document.createElement("div");
          card.className = "item";
          card.innerHTML = `
            <div>
              <strong>${item.estabelecimento}</strong>
              <small>${item.data} • ${item.categoria} • ${item.subtipo}</small>
            </div>
            <div class="val">${valorFmt}</div>
          `;
          feedEl.prepend(card);
        }

        txtGasto.value = "";
      } catch (err) {
        statusEl.textContent = `Falha de conexão: ${err.message}`;
      } finally {
        btnEnviar.disabled = false;
      }
    }

    btnEnviar.addEventListener("click", () => enviarGasto());
    txtGasto.addEventListener("keydown", (e) => {
      if (e.key === "Enter") enviarGasto();
    });
  </script>
</body>
</html>
