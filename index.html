<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#09090b" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>Fatura Radar — Controle Mensal Nov 2026</title>
  <style>
    :root {
      --bg: #09090b;
      --surface: #121216;
      --surface-2: #18181f;
      --surface-3: #20202a;
      --border: rgba(255, 255, 255, 0.08);
      --border-strong: rgba(255, 255, 255, 0.22);
      --text: #f4f4f6;
      --muted: #9a9aa6;
      --muted-2: #71717a;
      --accent: #10b981;
      --accent-light: #6ee7b7;
      --sky: #38bdf8;
      --rose: #f43f5e;
      --amber: #fbbf24;
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

    html, body {
      margin: 0;
      padding: 0;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, sans-serif;
      min-height: 100dvh;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
    }

    .tabular { font-variant-numeric: tabular-nums; }

    .app-shell {
      width: 100%;
      max-width: 460px;
      margin: 0 auto;
      padding: calc(14px + var(--safe-top)) 14px calc(36px + var(--safe-bottom));
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 22px;
      padding: 15px;
    }

    .surface {
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: 16px;
    }

    .row-between {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--border);
      padding: 4px 10px;
      font-size: 11px;
      font-weight: 600;
      color: #d4d4d8;
    }

    .dot {
      width: 6px;
      height: 6px;
      border-radius: 999px;
      flex-shrink: 0;
    }

    .mic-btn {
      width: 78px;
      height: 78px;
      margin: 4px auto 0;
      border-radius: 999px;
      border: none;
      background: radial-gradient(circle at 30% 30%, #34d399, #059669);
      color: #042014;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 0 10px 26px rgba(16, 185, 129, 0.28);
      transition: transform 0.15s ease;
    }

    .mic-btn:active { transform: scale(0.95); }

    .mic-btn.listening {
      background: radial-gradient(circle at 30% 30%, #f87171, #dc2626);
      color: #fff;
      box-shadow: 0 0 0 10px rgba(239, 68, 68, 0.16), 0 12px 28px rgba(239, 68, 68, 0.35);
      animation: pulse 1.25s infinite;
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.04); }
    }

    .cmd-bar {
      display: flex;
      gap: 8px;
      width: 100%;
      margin-top: 6px;
    }

    .cmd-input {
      flex: 1;
      min-width: 0;
      border-radius: 13px;
      background: var(--surface-2);
      border: 1px solid var(--border);
      padding: 10px 12px;
      font-size: 14px;
      color: var(--text);
      outline: none;
    }

    .cmd-input:focus { border-color: rgba(16, 185, 129, 0.55); }

    .btn-primary {
      border-radius: 13px;
      background: rgba(16, 185, 129, 0.18);
      border: 1px solid rgba(16, 185, 129, 0.42);
      padding: 0 14px;
      font-size: 12px;
      font-weight: 700;
      color: var(--accent-light);
      cursor: pointer;
    }

    .btn-ghost {
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--border);
      padding: 4px 10px;
      font-size: 11px;
      font-weight: 600;
      color: #d4d4d8;
      cursor: pointer;
    }

    .btn-undo {
      border-radius: 8px;
      background: rgba(244, 63, 94, 0.14);
      border: 1px solid rgba(244, 63, 94, 0.35);
      padding: 2px 8px;
      font-size: 10px;
      font-weight: 700;
      color: #fda4af;
      cursor: pointer;
    }

    .grid-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .badge-work, .badge-leisure, .badge-refund {
      display: inline-block;
      margin-left: 5px;
      padding: 1px 6px;
      border-radius: 999px;
      font-size: 10px;
      font-weight: 700;
    }

    .badge-work { background: rgba(56, 189, 248, 0.18); color: #7dd3fc; }
    .badge-leisure { background: rgba(244, 63, 94, 0.18); color: #fda4af; }
    .badge-refund { background: rgba(16, 185, 129, 0.18); color: #6ee7b7; }

    .cat-card {
      padding: 12px;
      cursor: pointer;
      transition: background 0.15s ease, border-color 0.15s ease;
    }

    .cat-card.expanded {
      background: var(--surface-3);
      border-color: var(--border-strong);
    }

    .bar-track {
      margin-top: 8px;
      height: 6px;
      width: 100%;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.08);
      overflow: hidden;
    }

    .bar-fill {
      height: 100%;
      border-radius: 999px;
    }

    .donut-wrap {
      position: relative;
      width: 210px;
      height: 210px;
      margin: 14px auto;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .donut-center {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 0 14px;
      pointer-events: none;
    }

    .truncate {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
  </style>
</head>

      const roundCents = n => Math.round((Number(n) || 0) * 100) / 100;
      const toCents = n => Math.round(roundCents(n) * 100);
      const pad2 = n => String(n).padStart(2, "0");

      function formatBRL(v) {
        return (Number(v) || 0).toLocaleString("pt-BR", { style: "currency", currency: "BRL" });
      }

      function todayBR() {
        const d = new Date();
        return pad2(d.getDate()) + "/" + pad2(d.getMonth() + 1) + "/" + d.getFullYear();
      }

      function nowTimeBR() {
        const d = new Date();
        return pad2(d.getHours()) + ":" + pad2(d.getMinutes());
      }

      function formatDateBR(raw) {
        if (!raw) return todayBR();
        const s = String(raw).trim();
        const dmy = s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);
        if (dmy) return pad2(dmy[1]) + "/" + pad2(dmy[2]) + "/" + dmy[3];
        const iso = s.match(/^(\d{4})-(\d{2})-(\d{2})/);
        if (iso) return iso[3] + "/" + iso[2] + "/" + iso[1];
        const p = new Date(s);
        return isNaN(p.getTime()) ? s : pad2(p.getDate()) + "/" + pad2(p.getMonth() + 1) + "/" + p.getFullYear();
      }

      function normMerchant(name) {

          .normalize("NFD")
          .replace(/[\u0300-\u036f]/g, "")
          .replace(/\b(trabalho|lazer|credito|debito)\b/g, "")
          .replace(/[^a-z0-9]/g, "")
          .slice(0, 18);
      }

      function dedupKey(it) {
        return formatDateBR(it.data) + "|" + normMerchant(it.estabelecimento) + "|" + toCents(it.valor);
      }

      const OFFICIAL_RECORDS = OFFICIAL_ITEMS.map(r => ({
        id: r[0],
        data: formatDateBR(r[1]),
        estabelecimento: r[2],
        valor: roundCents(r[3]),
        categoria: r[4],
        subtipo: r[5] || "",
        meioPagamento: r[6] || "Crédito",
        origem: r[7] || "Base",
        syncStatus: r[8] || "synced"
      }));

      function readLocal() {
        try {
          const raw = localStorage.getItem(STORAGE_KEY);
          const arr = raw ? JSON.parse(raw) : [];
          return Array.isArray(arr) ? arr : [];
        } catch (_) {
          return [];
        }
      }

      function saveLocal(list) {
        try { localStorage.setItem(STORAGE_KEY, JSON.stringify(list)); } catch (_) {}
      }

      let addedEntries = readLocal();
      let remoteEntries = null;
      let selectedCategory = null;
      let pendingRide = null;
      let isListening = false;
      let recognition = null;
      let syncState = "syncing";
      let isPulling = false;
      let lastSyncTime = "";
      let feedbackText = 'Auto-sync ativo (20s). Fale ou digite: "42,50 mercado", "estorno 15 mercado" ou "Uber 32"';
      let feedbackTone = "muted";

      function getAllEntries() {
        const remote = Array.isArray(remoteEntries) ? remoteEntries.slice().reverse() : [];
        const seenIds = new Set();
        const seenKeys = new Set();
        const out = [];
        const sources = [addedEntries, remote, OFFICIAL_RECORDS];

        for (let s = 0; s < sources.length; s++) {
          const arr = sources[s];
          for (let i = 0; i < arr.length; i++) {
            const it = arr[i];
            if (!it || toCents(it.valor) === 0) continue;
            const norm = Object.assign({}, it, {
              data: formatDateBR(it.data),
              valor: roundCents(it.valor)
            });
            const id = String(norm.id || "").trim();
            const key = dedupKey(norm);
            if (id && seenIds.has(id)) continue;
            if (seenKeys.has(key)) continue;
            if (id) seenIds.add(id);
            seenKeys.add(key);
            out.push(norm);
          }
        }
        return out;
      }

      function groupCategories(entries) {
        const map = {};
        for (let i = 0; i < entries.length; i++) {
          const it = entries[i];
          const cat = it.categoria || "Compras / Presentes";
          if (!map[cat]) {
            map[cat] = {
              name: cat,
              total: 0,
              count: 0,
              items: [],
              color: CATEGORY_COLORS[cat] || "#10b981",
              cap: CATEGORY_CAPS[cat] || 300
            };
          }
          map[cat].total = roundCents(map[cat].total + it.valor);
          map[cat].count += 1;
          map[cat].items.push(it);
        }
        return Object.values(map).sort((a, b) => b.total - a.total);
      }

      function extractNumber(raw) {
        const m = (raw || "").match(/(?:r\$\s*)?(\d+(?:[.,]\d{1,2})?)/i);
        if (!m) return null;
        let t = m[1];
        if (t.includes(",") && t.includes(".")) t = t.replace(/\./g, "").replace(",", ".");
        else if (t.includes(",")) t = t.replace(",", ".");
        const v = parseFloat(t);
        return Number.isFinite(v) && v > 0 ? roundCents(v) : null;
      }

      function parseCommand(rawInput) {
        const clean = (rawInput || "").trim();
        if (!clean) return null;
        const norm = clean.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "");
        const absVal = extractNumber(norm);
        if (!absVal) return null;

        const isRefund = /\b(estorno|reembolso|devolucao|refund|creditado)\b/.test(norm);
        const valor = isRefund ? -absVal : absVal;
        const meioPagamento = /\bdebito\b/.test(norm) ? "Débito" : "Crédito";

        const isRide = /\b(uber|99|corrida|taxi|ride)\b/.test(norm);
        const isWork = /\b(trabalho|trabalhar|escritorio|reuniao|cliente|firma|servico)\b/.test(norm);
        const isLeisure = /\b(lazer|festa|amigo|amigos|role|sair|passeio|bar|balada)\b/.test(norm);

        if ((isRide || isWork || isLeisure) && !isRefund) {
          if (isWork && !isLeisure) return { needsConfirm: false, valor, categoria: "Transporte", subtipo: "Trabalho", meioPagamento, desc: clean };
          if (isLeisure && !isWork) return { needsConfirm: false, valor, categoria: "Transporte", subtipo: "Lazer", meioPagamento, desc: clean };
          return { needsConfirm: true, valor, meioPagamento, desc: clean };
        }

        if (/\b(metro|cptm|onibus|passagem|bilhete|transporte)\b/.test(norm)) {
          return { needsConfirm: false, valor, categoria: "Transporte", subtipo: "Trabalho", meioPagamento, desc: clean };
        }
        if (/\b(mercado|hortifruti|supermercado|feira|pomar|acougue|verdura|fruta|lopes)\b/.test(norm)) {
          return { needsConfirm: false, valor, categoria: "Mercado / Hortifruti", subtipo: "", meioPagamento, desc: clean };
        }
        if (/\b(pizza|keeta|ifood|99food|restaurante|lanche|burger|hamburguer|sushi|japa|jantar|delivery|comida)\b/.test(norm)) {
          return { needsConfirm: false, valor, categoria: "Restaurante / Delivery", subtipo: "", meioPagamento, desc: clean };
        }
        if (/\b(oxxo|pao|croissant|cafe|leite|conveniencia|americanas|maquina|vend perto|padaria|dia a dia|energetico|monster|red bull)\b/.test(norm)) {
          return { needsConfirm: false, valor, categoria: "Conveniência / Dia a dia", subtipo: "", meioPagamento, desc: clean };
        }
        if (/\b(anthropic|claude|ia|ai|chatgpt|apple|netflix|canva|vivo|assinatura|app)\b/.test(norm)) {
          return { needsConfirm: false, valor, categoria: "Assinaturas / IA / Apps", subtipo: "", meioPagamento, desc: clean };
        }
        if (/\b(farmacia|drogasil|remedio|saude|cabelo|hair|estetica|salao|medico|dentista)\b/.test(norm)) {
          return { needsConfirm: false, valor, categoria: "Saúde / Cuidados", subtipo: "", meioPagamento, desc: clean };
        }
        return { needsConfirm: false, valor, categoria: "Compras / Presentes", subtipo: "", meioPagamento, desc: clean };
      }

      async function fetchTimeout(url, opts) {
        const ctrl = typeof AbortController !== "undefined" ? new AbortController() : null;
        const timer = ctrl ? setTimeout(() => ctrl.abort(), SYNC_TIMEOUT_MS) : null;
        try {
          return await fetch(url, Object.assign({}, opts || {}, ctrl ? { signal: ctrl.signal } : {}));
        } finally {
          if (timer) clearTimeout(timer);
        }
      }

      async function flushPendingQueue() {
        const pending = addedEntries.filter(it => it.syncStatus !== "synced");
        if (!pending.length) return;
        try {
          const res = await fetchTimeout(APPS_SCRIPT_URL, {
            method: "POST",
            redirect: "follow",
            headers: { "Content-Type": "text/plain;charset=utf-8" },
            body: JSON.stringify({
              items: pending.map(it => ({
                id: it.id,
                date: it.data,
                desc: it.estabelecimento,
                val: it.valor,
                cat: it.categoria,
                subtipo: it.subtipo,
                meioPagamento: it.meioPagamento,
                origem: it.origem
              }))
            })
          });
          if (res && res.ok) {
            pending.forEach(it => { it.syncStatus = "synced"; });
            saveLocal(addedEntries);
          }
        } catch (_) {}
      }

      async function syncPull(silent) {
        if (!APPS_SCRIPT_URL || isPulling) return;
        isPulling = true;
        if (!silent) {
          syncState = "syncing";
          renderApp();
        }

        try {
          await flushPendingQueue();
          const sep = APPS_SCRIPT_URL.includes("?") ? "&" : "?";
          const res = await fetchTimeout(APPS_SCRIPT_URL + sep + "t=" + Date.now(), {
            method: "GET",
            redirect: "follow"
          });
          if (!res || !res.ok) throw new Error("HTTP");
          const data = await res.json();
          if (data && data.ok && Array.isArray(data.items)) {
            remoteEntries = data.items.map((r, idx) => ({
              id: String(r.id || "SHEET-" + (idx + 1)),
              data: formatDateBR(r.date || r.data || todayBR()),
              estabelecimento: String(r.desc || r.estabelecimento || "Lançamento"),
              valor: roundCents(r.val !== undefined ? r.val : r.valor),
              categoria: String(r.cat || r.categoria || "Compras / Presentes"),
              subtipo: String(r.subtipo || ""),
              meioPagamento: String(r.meioPagamento || "Crédito"),
              origem: String(r.origem || "Planilha"),
              syncStatus: "synced"
            }));

            const knownKeys = new Set(remoteEntries.map(dedupKey));
            let changed = false;
            addedEntries.forEach(loc => {
              if (knownKeys.has(dedupKey(loc)) && loc.syncStatus !== "synced") {
                loc.syncStatus = "synced";
                changed = true;
              }
            });
            if (changed) saveLocal(addedEntries);

            syncState = "synced";
            lastSyncTime = nowTimeBR();
          } else {
            syncState = "fallback";
          }
        } catch (_) {
          syncState = "fallback";
        } finally {
          isPulling = false;
          renderApp();
        }
      }

      function addEntry(valor, categoria, subtipo, desc, meioPagamento) {
        const entry = {
          id: "VOZ-" + Date.now(),
          data: todayBR(),
          estabelecimento: desc,
          valor: roundCents(valor),
          categoria: categoria,
          subtipo: subtipo || "",
          meioPagamento: meioPagamento || "Crédito",
          origem: "App Voz",
          syncStatus: "pending"
        };
        addedEntries = [entry].concat(addedEntries);
        saveLocal(addedEntries);
        const label = subtipo ? categoria + " — " + subtipo : categoria;
        feedbackText = (entry.valor < 0 ? "Estorno de " : "Registrado ") + formatBRL(Math.abs(entry.valor)) + " (" + entry.meioPagamento + ") em " + label + ".";
        feedbackTone = "ok";
        renderApp();
        syncPull(true);
      }

      function removeLocalEntry(id) {
        addedEntries = addedEntries.filter(it => it.id !== id);
        saveLocal(addedEntries);
        feedbackText = "Lançamento local removido.";
        feedbackTone = "muted";
        renderApp();
      }

      function processCommand(text) {
        const parsed = parseCommand(text);
        if (!parsed) {
          feedbackText = 'Não identifiquei valor em "' + text + '". Ex.: "42,50 mercado" ou "estorno 15 mercado".';
          feedbackTone = "warn";
          renderApp();
          return;
        }
        if (parsed.needsConfirm) {
          pendingRide = parsed;
          feedbackText = "Confirme se o transporte de " + formatBRL(parsed.valor) + " foi Trabalho ou Lazer.";
          feedbackTone = "ok";
          renderApp();
          return;
        }
        addEntry(parsed.valor, parsed.categoria, parsed.subtipo, parsed.desc, parsed.meioPagamento);
      }

      function toggleVoice() {
        const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (!SR) {
          feedbackText = "Microfone indisponível neste navegador. Use o campo abaixo.";
          feedbackTone = "warn";
          renderApp();
          return;
        }
        if (isListening && recognition) {
          try { recognition.stop(); } catch (_) {}
          isListening = false;
          renderApp();
          return;
        }
        try {
          recognition = new SR();
          recognition.lang = "pt-BR";
          recognition.interimResults = false;
          isListening = true;
          feedbackText = 'Ouvindo... fale ex.: "Uber 32 reais" ou "estorno 20 mercado".';
          feedbackTone = "ok";
          renderApp();

          recognition.onresult = e => {
            const said = e && e.results && e.results[0] && e.results[0][0] ? e.results[0][0].transcript : "";
            isListening = false;
            processCommand(said);
          };
          recognition.onerror = () => {
            isListening = false;
            feedbackText = "Não foi possível captar o áudio. Tente digitar.";
            feedbackTone = "warn";
            renderApp();
          };
          recognition.onend = () => {
            if (isListening) { isListening = false; renderApp(); }
          };
          recognition.start();
        } catch (_) {
          isListening = false;
          feedbackText = "Microfone bloqueado. Digite o lançamento abaixo.";
          feedbackTone = "warn";
          renderApp();
        }
      }

      function buildDonutSVG(categories, total) {
        const r = 74, cx = 105, cy = 105, circ = 2 * Math.PI * r;
        let offset = 0;
        const segs = categories.map(cat => {
          const val = Math.max(0, cat.total);
          const frac = total > 0 ? val / total : 0;
          const dash = frac * circ;
          const gap = Math.max(0, circ - dash);
          const active = selectedCategory === cat.name;
          const opacity = selectedCategory && !active ? 0.35 : 1;
          const circle = `<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${cat.color}" stroke-width="${active ? 24 : 20}" stroke-dasharray="${dash.toFixed(2)} ${gap.toFixed(2)}" stroke-dashoffset="${(-offset).toFixed(2)}" transform="rotate(-90 ${cx} ${cy})" opacity="${opacity}" style="cursor:pointer" data-cat="${encodeURIComponent(cat.name)}" />`;
          offset += dash;
          return circle;
        }).join("");
        return `<svg width="210" height="210" viewBox="0 0 210 210">${segs}</svg>`;
      }

      function esc(s) {
        return String(s || "").replace(/&/g, "&").replace(/</g, "<").replace(/>/g, ">").replace(/"/g, """);
      }

      function renderApp() {
        const root = document.getElementById("app");
        if (!root) return;

        const entries = getAllEntries();
        const grandTotal = roundCents(entries.reduce((s, x) => s + x.valor, 0));
        const debitTotal = roundCents(entries.filter(x => String(x.meioPagamento).toLowerCase() === "débito").reduce((s, x) => s + x.valor, 0));
        const creditTotal = roundCents(grandTotal - debitTotal);

        const cats = groupCategories(entries);
        const activeCat = cats.find(c => c.name === selectedCategory);
        const workTotal = roundCents(entries.filter(x => x.categoria === "Transporte" && x.subtipo === "Trabalho").reduce((s, x) => s + x.valor, 0));
        const leisureTotal = roundCents(entries.filter(x => x.categoria === "Transporte" && x.subtipo === "Lazer").reduce((s, x) => s + x.valor, 0));

        const recent = entries.slice(0, 5);
        const syncColor = syncState === "synced" ? "#34d399" : syncState === "syncing" ? "#38bdf8" : "#fbbf24";
        const syncText = syncState === "synced" ? "Auto-sync OK" + (lastSyncTime ? " · " + lastSyncTime : "") : syncState === "syncing" ? "Sincronizando..." : "Cache Local + Auto-sync";
        const fbColor = feedbackTone === "ok" ? "#6ee7b7" : feedbackTone === "warn" ? "#fcd34d" : "#9a9aa6";

        const rideHtml = pendingRide ? `
          <div class="card" style="background:linear-gradient(180deg,rgba(56,189,248,0.14),#121216);border-color:rgba(56,189,248,0.4);">
            <div class="row-between" style="font-size:11px;font-weight:700;text-transform:uppercase;color:#7dd3fc;">
              <span>Corrida de Transporte</span>
              <button type="button" class="btn-ghost" data-action="cancel-ride">Cancelar</button>
            </div>
            <div style="margin-top:8px;font-size:15px;font-weight:700;">Esse transporte de ${formatBRL(pendingRide.valor)} foi Trabalho ou Lazer?</div>
            <div style="margin-top:2px;font-size:12px;color:#9a9aa6;">"${esc(pendingRide.desc)}"</div>
            <div class="grid-2" style="margin-top:10px;">
              <button type="button" class="btn-primary" style="padding:10px;background:rgba(56,189,248,0.2);border-color:rgba(56,189,248,0.45);color:#e0f2fe;" data-action="ride-work">Trabalho</button>
              <button type="button" class="btn-primary" style="padding:10px;background:rgba(244,63,94,0.2);border-color:rgba(244,63,94,0.45);color:#ffe4e6;" data-action="ride-leisure">Lazer</button>
            </div>
          </div>` : "";

        const recentHtml = recent.map(it => {
          const badge = it.subtipo === "Trabalho" ? '<span class="badge-work">Trabalho</span>'
            : it.subtipo === "Lazer" ? '<span class="badge-leisure">Lazer</span>'
            : it.valor < 0 ? '<span class="badge-refund">Estorno</span>' : "";
          const canUndo = String(it.id).startsWith("VOZ-");
          return `
            <div class="row-between tabular" style="padding:7px 0;border-bottom:1px solid rgba(255,255,255,0.06);font-size:12px;">
              <div style="min-width:0;display:flex;align-items:center;gap:8px;">
                <span class="dot" style="background:${it.syncStatus === "synced" ? "#34d399" : "#fbbf24"};"></span>
                <div class="truncate">
                  <span style="font-weight:600;">${esc(it.estabelecimento)}</span>${badge}
                  <div style="font-size:10px;color:#71717a;">${esc(it.data)} · ${esc(it.categoria)} · ${esc(it.meioPagamento || "Crédito")}</div>
                </div>
              </div>
              <div style="display:flex;align-items:center;gap:6px;flex-shrink:0;">
                <span style="font-weight:700;color:${it.valor < 0 ? "#6ee7b7" : "#f4f4f6"};">${formatBRL(it.valor)}</span>
                ${canUndo ? `<button type="button" class="btn-undo" data-undo="${esc(it.id)}">Desfazer</button>` : ""}
              </div>
            </div>`;
        }).join("");

        const catsHtml = cats.map(c => {
          const share = grandTotal > 0 ? ((c.total / grandTotal) * 100).toFixed(1) : "0.0";
          const ratio = c.cap > 0 ? Math.min(100, Math.max(0, (c.total / c.cap) * 100)).toFixed(1) : "100.0";
          const bal = roundCents(c.cap - c.total);
          const balTxt = bal >= 0 ? "Saldo: " + formatBRL(bal) : "Acima: " + formatBRL(Math.abs(bal));
          const exp = selectedCategory === c.name;
          const itemsHtml = exp ? `<div style="margin-top:10px;padding-top:10px;border-top:1px solid rgba(255,255,255,0.08);display:flex;flex-direction:column;gap:6px;">
            ${c.items.map(e => {
              const b = e.subtipo === "Trabalho" ? '<span class="badge-work">Trabalho</span>' : e.subtipo === "Lazer" ? '<span class="badge-leisure">Lazer</span>' : "";
              return `<div class="row-between tabular" style="font-size:12px;color:#9a9aa6;">
                <span class="truncate">${esc(e.data)} · <strong style="color:#f4f4f6;">${esc(e.estabelecimento)}</strong>${b}</span>
                <span style="font-weight:600;color:${e.valor < 0 ? "#6ee7b7" : "#e4e4e7"};flex-shrink:0;">${formatBRL(e.valor)}</span>
              </div>`;
            }).join("")}
          </div>` : "";

          return `
            <div class="surface cat-card ${exp ? "expanded" : ""}" data-cat="${encodeURIComponent(c.name)}">
              <div class="row-between tabular" style="font-size:13px;font-weight:600;">
                <span style="display:flex;align-items:center;gap:8px;min-width:0;">
                  <span class="dot" style="width:10px;height:10px;background:${c.color};"></span>
                  <span class="truncate">${esc(c.name)}</span>
                </span>
                <span style="flex-shrink:0;">${formatBRL(c.total)} (${share}%)</span>
              </div>
              <div class="bar-track"><div class="bar-fill" style="width:${ratio}%;background:${c.color};"></div></div>
              <div class="row-between tabular" style="margin-top:6px;font-size:11px;color:#9a9aa6;">
                <span class="truncate">${c.count} itens · Teto ${formatBRL(c.cap)} (${balTxt})</span>
                <span style="flex-shrink:0;">${exp ? "Ocultar ▲" : "Itens ▼"}</span>
              </div>
              ${itemsHtml}
            </div>`;
        }).join("");

        root.innerHTML = `
          <div class="card" style="text-align:center;display:flex;flex-direction:column;gap:10px;">
            <div class="row-between">
              <span style="font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:#34d399;">Fatura Radar — Nov 2026</span>
              <span class="pill"><span class="dot" style="background:${syncColor};"></span><span>${syncText}</span></span>
            </div>
            <button type="button" class="mic-btn ${isListening ? "listening" : ""}" data-action="mic" aria-label="Falar gasto">
              <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="9" y="2" width="6" height="12" rx="3"></rect>
                <path d="M5 10a7 7 0 0 0 14 0"></path>
                <line x1="12" y1="19" x2="12" y2="22"></line>
              </svg>
            </button>
            <div style="font-size:14px;font-weight:700;">${isListening ? "Ouvindo agora..." : "Toque para falar o gasto"}</div>
            <div style="font-size:12px;line-height:1.4;color:${fbColor};">${esc(feedbackText)}</div>
            <div class="cmd-bar">
              <input id="cmdInput" class="cmd-input" type="text" placeholder='Ex.: "42,50 mercado" ou "estorno 15 mercado"' />
              <button type="button" class="btn-primary" data-action="submit-cmd">Lançar</button>
            </div>
          </div>

          ${rideHtml}

          <div class="card">
            <div class="row-between" style="margin-bottom:6px;">
              <span style="font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:#d4d4d8;">Últimos Lançamentos</span>
              <button type="button" class="btn-ghost" data-action="refresh">${isPulling ? "Atualizando..." : "Atualizar ↻"}</button>
            </div>
            ${recentHtml}
          </div>

          <div class="card">
            <div style="font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:#34d399;">Total Consolidado</div>
            <div class="tabular" style="margin-top:2px;font-size:28px;font-weight:800;letter-spacing:-0.02em;">${formatBRL(grandTotal)}</div>
            <div class="tabular" style="font-size:12px;color:#9a9aa6;">${entries.length} lançamentos · Crédito: ${formatBRL(creditTotal)} · Débito: ${formatBRL(debitTotal)}</div>

            <div class="grid-2" style="margin-top:12px;">
              <div class="surface tabular" style="padding:11px;">
                <div style="font-size:11px;color:#9a9aa6;">Transporte — Trabalho</div>
                <div style="margin-top:2px;font-size:16px;font-weight:700;color:#38bdf8;">${formatBRL(workTotal)}</div>
              </div>
              <div class="surface tabular" style="padding:11px;">
                <div style="font-size:11px;color:#9a9aa6;">Transporte — Lazer</div>
                <div style="margin-top:2px;font-size:16px;font-weight:700;color:#f43f5e;">${formatBRL(leisureTotal)}</div>
              </div>
            </div>

            <div class="donut-wrap">
              ${buildDonutSVG(cats, grandTotal)}
              <div class="donut-center tabular">
                <div style="font-size:11px;text-transform:uppercase;color:#9a9aa6;">${esc(activeCat ? activeCat.name.split(" / ")[0] : "Fatura Líquida")}</div>
                <div style="margin-top:2px;font-size:17px;font-weight:800;">${formatBRL(activeCat ? activeCat.total : grandTotal)}</div>
                <div style="margin-top:2px;font-size:11px;font-weight:600;color:#34d399;">${activeCat ? ((activeCat.total / (grandTotal || 1)) * 100).toFixed(1) + "% · " + activeCat.count + " itens" : entries.length + " itens"}</div>
              </div>
            </div>

            <div style="display:flex;flex-direction:column;gap:9px;">${catsHtml}</div>
          </div>
        `;
      }

      document.getElementById("app").addEventListener("click", e => {
        const undoBtn = e.target.closest("[data-undo]");
        if (undoBtn) {
          e.stopPropagation();
          removeLocalEntry(undoBtn.getAttribute("data-undo"));
          return;
        }
        const actionEl = e.target.closest("[data-action]");
        if (actionEl) {
          const act = actionEl.getAttribute("data-action");
          if (act === "mic") toggleVoice();
          else if (act === "refresh") syncPull(false);
          else if (act === "submit-cmd") {
            const inp = document.getElementById("cmdInput");
            if (inp && inp.value.trim()) {
              const val = inp.value;
              inp.value = "";
              processCommand(val);
            }
          } else if (act === "ride-work" && pendingRide) {
            const r = pendingRide; pendingRide = null;
            addEntry(r.valor, "Transporte", "Trabalho", r.desc + " (Trabalho)", r.meioPagamento);
          } else if (act === "ride-leisure" && pendingRide) {
            const r = pendingRide; pendingRide = null;
            addEntry(r.valor, "Transporte", "Lazer", r.desc + " (Lazer)", r.meioPagamento);
          } else if (act === "cancel-ride") {
            pendingRide = null;
            feedbackText = "Confirmação cancelada.";
            feedbackTone = "muted";
            renderApp();
          }
          return;
        }
        const catEl = e.target.closest("[data-cat]");
        if (catEl) {
          const name = decodeURIComponent(catEl.getAttribute("data-cat"));
          selectedCategory = selectedCategory === name ? null : name;
          renderApp();
        }
      });

      document.getElementById("app").addEventListener("keydown", e => {
        if (e.target && e.target.id === "cmdInput" && e.key === "Enter") {
          e.preventDefault();
          const val = e.target.value;
          e.target.value = "";
          if (val.trim()) processCommand(val);
        }
      });

      // Auto-sync ao abrir, a cada 20s enquanto visível e imediatamente ao voltar para a aba/app
      renderApp();
      syncPull(false);
      setInterval(() => {
        if (!document.hidden) syncPull(true);
      }, AUTO_SYNC_INTERVAL_MS);
      document.addEventListener("visibilitychange", () => {
        if (!document.hidden) syncPull(true);
      });
      window.addEventListener("focus", () => syncPull(true));
    })();
  </script>
</body>
</html>
